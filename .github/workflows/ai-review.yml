name: AI PR Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI PR Debugger
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          # Fallback to mock mode if no API key is set in repository secrets
          MOCK_LLM: ${{ secrets.OPENAI_API_KEY == '' && secrets.LLM_API_KEY == '' }}
        run: |
          python -m app review --git --branch origin/${{ github.base_ref }} --format markdown --output pr_review.md

      - name: Submit Formal Pull Request Review
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              const requestChanges = body.includes('REQUEST CHANGES');
              const event = requestChanges ? 'REQUEST_CHANGES' : 'APPROVE';

              try {
                // Submit as a formal GitHub Pull Request Review
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: body,
                  event: event
                });
              } catch (err) {
                // Fallback to standard PR issue comment if review submission is restricted
                console.log('Falling back to issue comment:', err.message);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }
