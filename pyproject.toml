[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-debugger"
version = "0.1.0"
description = "AI-powered automated Pull Request code reviewer and debugging engine"
readme = "README.md"
authors = [
    { name = "Yash Jain" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.1.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
ai-pr-debugger = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

